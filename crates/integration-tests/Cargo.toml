[package]
name = "integration-tests"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
datatest-stable.workspace = true
expectorate.workspace = true
heck.workspace = true
oxide-generation-macros.workspace = true
oxide-generation.workspace = true
prettyplease.workspace = true
proc-macro2.workspace = true
proptest = { workspace = true, optional = true }
quote.workspace = true
schemars = { workspace = true, optional = true, features = ["derive"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, optional = true }
serde_tokenstream.workspace = true
syn = { workspace = true, features = ["full"] }
test-strategy = { workspace = true, optional = true }
typify = { workspace = true, optional = true }

[dev-dependencies]
trybuild.workspace = true

[features]
internal-schemars08-tests = [
    "oxide-generation/schemars08",
    "oxide-generation/serde",
    "dep:schemars",
    "dep:serde_json",
    "dep:typify",
]
internal-proptest1-tests = [
    "oxide-generation/proptest1",
    "dep:proptest",
    "dep:test-strategy",
]

[[test]]
# Snapshot tests use datatest-stable.
name = "snapshot"
harness = false

[package.metadata.release]
release = false
