[package]
name = "oxide-generation-macros"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/oxide-generation-macros"
rust-version.workspace = true
description = "Procedural macro for oxide-generation"
readme = "README.md"
keywords = ["generation", "version", "concurrency", "newtype"]

[lib]
proc-macro = true

[dependencies]
heck.workspace = true
proc-macro2.workspace = true
quote.workspace = true
serde = { workspace = true, features = ["std", "derive"] }
serde_tokenstream.workspace = true
syn = { workspace = true, features = ["full"] }

[dev-dependencies]
oxide-generation.workspace = true
serde = { workspace = true, features = ["std", "derive"] }
static_assertions.workspace = true

[package.metadata.cargo-sync-rdme.badge.badges]
license = true
crates-io = true
docs-rs = true
rust-version = true

[package.metadata.release]
pre-release-replacements = [
    { file = "CHANGELOG.md", search = "Unreleased", replace = "[{{version}}]", min = 1 },
    { file = "CHANGELOG.md", search = "ReleaseDate", replace = "{{date}}", min = 1 },
    { file = "CHANGELOG.md", search = "<!-- next-header -->", replace = "<!-- next-header -->\n## Unreleased - ReleaseDate\n", exactly = 1 },
    { file = "CHANGELOG.md", search = "<!-- next-url -->", replace = "<!-- next-url -->\n[{{version}}]: https://github.com/oxidecomputer/oxide-generation/releases/oxide-generation-macros-{{version}}", exactly = 1 },
]
