[package]
name = "oxide-generation"
version = "0.1.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Untyped and typed generation numbers"
documentation = "https://docs.rs/oxide-generation"
readme = "README.md"
keywords = ["generation", "version", "concurrency", "newtype"]
categories = ["data-structures", "no-std"]
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg=doc_cfg"]

[dependencies]
daft = { workspace = true, optional = true }
proptest = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
slog = { workspace = true, optional = true }

[dev-dependencies]
oxide-generation-macros.workspace = true
serde_json.workspace = true

[features]
default = ["std"]
# Forward `std` to optional dependencies so that their std-only impls are
# available whenever ours are.
std = ["daft?/std", "serde?/std", "slog?/std"]
serde = ["dep:serde"]
# schemars 0.8 requires the standard library.
schemars08 = ["dep:schemars", "dep:serde_json", "std"]
# proptest requires the standard library.
proptest1 = ["dep:proptest", "std"]
daft01 = ["dep:daft"]
slog2 = ["dep:slog"]

[package.metadata.cargo-sync-rdme.badge.badges]
license = true
crates-io = true
docs-rs = true
rust-version = true

[package.metadata.release]
pre-release-replacements = [
    { file = "../../CHANGELOG.md", search = "Unreleased", replace = "[{{version}}]", min = 1 },
    { file = "../../CHANGELOG.md", search = "ReleaseDate", replace = "{{date}}", min = 1 },
    { file = "../../CHANGELOG.md", search = "<!-- next-header -->", replace = "<!-- next-header -->\n## Unreleased - ReleaseDate\n", exactly = 1 },
    { file = "../../CHANGELOG.md", search = "<!-- next-url -->", replace = "<!-- next-url -->\n[{{version}}]: https://github.com/oxidecomputer/oxide-generation/releases/oxide-generation-{{version}}", exactly = 1 },
]
