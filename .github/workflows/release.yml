# adapted from https://github.com/taiki-e/cargo-hack/blob/main/.github/workflows/release.yml

name: Publish release
on:
  push:
    tags:
      - "*"

jobs:
  oxide-typed-generation-release:
    if: github.repository_owner == 'oxidecomputer' && startsWith(github.ref_name, 'oxide-typed-generation-0')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write     # Required for OIDC token exchange
      contents: write     # Required for creating releases
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-release@0.25
      - run: just ci-cargo-release oxide-typed-generation
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - uses: taiki-e/create-gh-release-action@26b80501670402f1999aff4b934e1574ef2d3705 # v1
        with:
          changelog: CHANGELOG.md
          title: oxide-typed-generation $version
          branch: main
          prefix: oxide-typed-generation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  oxide-typed-generation-macros-release:
    if: github.repository_owner == 'oxidecomputer' && startsWith(github.ref_name, 'oxide-typed-generation-macros-')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write     # Required for OIDC token exchange
      contents: write     # Required for creating releases
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-release@0.25
      - run: just ci-cargo-release oxide-typed-generation-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - uses: taiki-e/create-gh-release-action@26b80501670402f1999aff4b934e1574ef2d3705 # v1
        with:
          changelog: crates/oxide-typed-generation-macros/CHANGELOG.md
          title: oxide-typed-generation-macros $version
          branch: main
          prefix: oxide-typed-generation-macros
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
